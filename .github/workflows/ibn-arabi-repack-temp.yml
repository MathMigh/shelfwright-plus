name: Ibn Arabi repack transfer bridge

on:
  push:
    paths: ['.github/workflows/ibn-arabi-repack-temp.yml']

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download existing 50+ artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/9984177449/zip > aggregate.zip
          mkdir corpus
          unzip -q aggregate.zip -d corpus
          echo "PDFS=$(find corpus -type f -name '*.pdf' | wc -l)"

      - name: Repack into seven sub-500MB transport chunks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, zipfile, glob, json
          files=sorted(glob.glob('corpus/**/*.pdf', recursive=True))
          files=[p for p in files if '/piece-60/' not in p and not p.startswith('corpus/piece-60/')]
          max_bytes=360*1024*1024
          groups=[]; cur=[]; total=0
          for p in files:
              s=os.path.getsize(p)
              if cur and total+s>max_bytes:
                  groups.append(cur); cur=[]; total=0
              cur.append(p); total+=s
          if cur: groups.append(cur)
          assert len(groups)==7, len(groups)
          os.makedirs('chunks',exist_ok=True)
          manifest=[]
          for i,g in enumerate(groups,1):
              z=f'chunks/ibn-arabi-batch01-part-{i:02d}.zip'
              with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as out:
                  for p in g:
                      parent=os.path.basename(os.path.dirname(p))
                      out.write(p,arcname=f'{parent}__{os.path.basename(p)}')
              manifest.append({'part':i,'count':len(g),'bytes':os.path.getsize(z)})
              print('PART',i,'COUNT',len(g),'BYTES',os.path.getsize(z))
          with open('chunks/00_manifest.json','w') as f:json.dump(manifest,f,indent=2)
          print('TOTAL_PDFS',sum(x['count'] for x in manifest))
          assert sum(x['count'] for x in manifest)==59
          PY
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-01, path: chunks/ibn-arabi-batch01-part-01.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-02, path: chunks/ibn-arabi-batch01-part-02.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-03, path: chunks/ibn-arabi-batch01-part-03.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-04, path: chunks/ibn-arabi-batch01-part-04.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-05, path: chunks/ibn-arabi-batch01-part-05.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-06, path: chunks/ibn-arabi-batch01-part-06.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-07, path: chunks/ibn-arabi-batch01-part-07.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-transfer-manifest, path: chunks/00_manifest.json, retention-days: 7}
