name: Ibn Arabi repack transfer bridge

on:
  push:
    paths: ['.github/workflows/ibn-arabi-repack-temp.yml']

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download existing corpus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/9984131278/zip > aggregate.zip
          mkdir corpus
          unzip -q aggregate.zip -d corpus
          echo "PDFS=$(find corpus -type f -name '*.pdf' | wc -l)"

      - name: Repack into 9 transport chunks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, zipfile, glob, json
          files=sorted(glob.glob('corpus/**/*.pdf', recursive=True))
          max_bytes=300*1024*1024
          groups=[]; cur=[]; total=0
          for p in files:
              s=os.path.getsize(p)
              if cur and total+s>max_bytes:
                  groups.append(cur); cur=[]; total=0
              cur.append(p); total+=s
          if cur: groups.append(cur)
          assert len(groups)==9, len(groups)
          os.makedirs('chunks',exist_ok=True)
          manifest=[]
          for i,g in enumerate(groups,1):
              z=f'chunks/ibn-arabi-part-{i:02d}.zip'
              with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as out:
                  for p in g: out.write(p,arcname=os.path.basename(p))
              manifest.append({'part':i,'count':len(g),'bytes':os.path.getsize(z),'file':os.path.basename(z)})
              print('PART',i,'COUNT',len(g),'BYTES',os.path.getsize(z))
          with open('chunks/00_manifest.json','w') as f:json.dump(manifest,f,indent=2)
          assert sum(x['count'] for x in manifest)==65
          PY

      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-01, path: chunks/ibn-arabi-part-01.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-02, path: chunks/ibn-arabi-part-02.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-03, path: chunks/ibn-arabi-part-03.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-04, path: chunks/ibn-arabi-part-04.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-05, path: chunks/ibn-arabi-part-05.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-06, path: chunks/ibn-arabi-part-06.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-07, path: chunks/ibn-arabi-part-07.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-08, path: chunks/ibn-arabi-part-08.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-part-09, path: chunks/ibn-arabi-part-09.zip, compression-level: 0, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: ibn-arabi-manifest, path: chunks/00_manifest.json, retention-days: 7}
