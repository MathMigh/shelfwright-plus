name: Ibn Arabi Arabic discovery bridge

on:
  push:
    paths: ['.github/workflows/ibn-arabi-discover-temp.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect key Arabic corpus items
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA='Mozilla/5.0 (compatible; Shelfwright-IbnArabi-Inspector/1.0)'
          ids=['Majmua_Rasail_ibn_Arabi','20210411_1202','Rasail_Ibn_Arabi','20260610_20260610_1450','ibn_arabi','FUTOOHAT','20240415_20240415_0159','ar117myst90','ar117myst94','20240303_20240303_1135','20241114_20241114_1606','20241114_20241114_1604','20251202_20251202_1447']
          for ident in ids:
            u='https://archive.org/metadata/'+urllib.parse.quote(ident,safe='')
            try:
              rq=urllib.request.Request(u,headers={'User-Agent':UA})
              with urllib.request.urlopen(rq,timeout=45) as r:m=json.load(r)
            except Exception as e:
              print('ITEMFAIL',ident,repr(e));continue
            md=m.get('metadata',{}); print('\nITEM',ident,'TITLE',md.get('title'),'CREATOR',md.get('creator'))
            fs=[]
            for f in m.get('files',[]):
              n=f.get('name',''); fmt=f.get('format','');
              try:s=int(f.get('size') or 0)
              except:s=0
              if n.lower().endswith(('.pdf','.epub','.txt','.zip','.rar','.7z','.djvu','.sqlite','.db')) or fmt in ('Text PDF','PDF','EPUB','DjVuTXT'):
                fs.append((s,n,fmt))
            for s,n,fmt in sorted(fs,reverse=True)[:40]:
              print('FILE',s,fmt,n)
          PY
