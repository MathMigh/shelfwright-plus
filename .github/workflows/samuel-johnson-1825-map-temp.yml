name: Samuel Johnson 1825 volume mapper

on:
  push:
    paths: ['.github/workflows/samuel-johnson-1825-map-temp.yml']
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Infer Oxford 1825 volume numbers from IA OCR/title metadata
        shell: python
        run: |
          import json,re,urllib.parse,urllib.request,os
          UA='Mozilla/5.0 (compatible; Shelfwright-SJ1825Mapper/1.0)'
          ids='''workssamueljohn02walegoog workssamueljohn37johngoog workssamueljohn28johngoog workssamueljohn26johngoog workssamueljohn36johngoog workssamueljohn03walegoog workssamueljohn00walegoog workssamueljohn30unkngoog workssamueljohn01walegoog workssamueljohn05walegoog workssamueljohn06walegoog workssamueljohn07walegoog workssamueljohn04walegoog workssamueljohn33murpgoog workssamueljohn21johngoog workssamueljohn27johngoog workssamueljohn35johngoog workssamueljohn110murpgoog workssamueljohn116murpgoog workssamueljohn114murpgoog workssamueljohn113murpgoog workssamueljohn23johngoog workssamueljohn30johngoog workssamueljohn34johngoog workssamueljohn33johngoog workssamueljohn32johngoog workssamueljohn25johngoog workssamueljohn05johngoog workssamueljohn31johngoog'''.split()
          def req(url,t=45):
            q=urllib.request.Request(url,headers={'User-Agent':UA});return urllib.request.urlopen(q,timeout=t)
          def gj(url):
            with req(url) as r:return json.load(r)
          roman={'I':1,'II':2,'III':3,'IV':4,'V':5,'VI':6,'VII':7,'VIII':8,'IX':9,'X':10,'XI':11,'XII':12}
          out=[]
          for ident in ids:
            try:m=gj('https://archive.org/metadata/'+ident)
            except Exception as e:out.append({'id':ident,'error':repr(e)});continue
            md=m.get('metadata',{}); files=m.get('files',[])
            textfiles=[]
            for f in files:
              n=f.get('name','').lower(); s=int(f.get('size') or 0)
              if n.endswith('_djvu.txt') or n.endswith('.txt'):
                if 1000<s<10000000:textfiles.append((0 if n.endswith('_djvu.txt') else 1,-s,f.get('name')))
            textfiles.sort(); sample=''
            if textfiles:
              name=textfiles[0][2]
              url='https://archive.org/download/{}/{}'.format(ident,urllib.parse.quote(name,safe='/'))
              try:
                with req(url,45) as r:sample=r.read(240000).decode('utf-8','ignore')
              except Exception:pass
            clean=' '.join(sample[:120000].split())
            hits=[]
            patterns=[r'VOLUME\s+(?:THE\s+)?(ELEVENTH|TENTH|NINTH|EIGHTH|SEVENTH|SIXTH|FIFTH|FOURTH|THIRD|SECOND|FIRST)',r'VOL(?:UME)?\.?\s*([IVX]{1,4}|\d{1,2})']
            words={'FIRST':1,'SECOND':2,'THIRD':3,'FOURTH':4,'FIFTH':5,'SIXTH':6,'SEVENTH':7,'EIGHTH':8,'NINTH':9,'TENTH':10,'ELEVENTH':11}
            for pat in patterns:
              for mm in re.finditer(pat,clean,re.I):
                z=mm.group(1).upper().strip('.')
                v=words.get(z) or roman.get(z)
                if not v:
                  try:v=int(z)
                  except:continue
                if 1<=v<=12:hits.append({'v':v,'context':clean[max(0,mm.start()-90):mm.end()+100]})
                if len(hits)>=5:break
              if hits:break
            pdfs=[]
            for f in files:
              n=f.get('name','');
              if n.lower().endswith('.pdf'):
                try:s=int(f.get('size') or 0)
                except:s=0
                pdfs.append({'name':n,'size':s,'source':f.get('source')})
            pdfs.sort(key=lambda x:(0 if x['source']=='original' else 1,-x['size']))
            out.append({'id':ident,'title':md.get('title'),'volume_meta':md.get('volume'),'publisher':md.get('publisher'),'date':md.get('date'),'ocr_file':textfiles[0][2] if textfiles else None,'hits':hits,'best_pdf':pdfs[0] if pdfs else None})
            print(ident,'meta',md.get('volume'),'hits',[h['v'] for h in hits[:3]])
          os.makedirs('out',exist_ok=True)
          with open('out/1825-volume-map.json','w',encoding='utf8') as f:json.dump(out,f,ensure_ascii=False,indent=2)
      - uses: actions/upload-artifact@v4
        with:
          name: sj-1825-volume-map
          path: out/
          retention-days: 7
